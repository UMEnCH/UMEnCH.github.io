<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">作戦総括 — 投入した文明と、四本足</title>
<desc id="d">人類側は八つの兵装と約十八万円を投入して七二時間かけて到達した快適を、むぎは無償・無自覚に初日から完成させていたという対比の図</desc>
<!-- 背景に敷く図。立ち絵が下から重なるので、内容は上寄せ・中央寄せにしてある。
     img で読むため色とフォントは直値で持つ（親のCSSも Webフォントも効かない） -->
<style>
  .f { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .kick { font-size: 15px; font-weight: 700; fill: #a9c29b; letter-spacing: .34em; }
  .ttl  { font-size: 34px; font-weight: 800; fill: #f6f1ec; letter-spacing: .04em; }
  .who  { font-size: 24px; font-weight: 800; fill: #f6f1ec; letter-spacing: .1em; }
  .whog { font-size: 24px; font-weight: 800; fill: #dde7d7; letter-spacing: .1em; }
  .k    { font-size: 18px; font-weight: 700; fill: #93858f; }
  .v    { font-size: 30px; font-weight: 800; fill: #a9c29b; }
  .vg   { font-size: 30px; font-weight: 800; fill: #dde7d7; }
  .mid  { font-size: 19px; font-weight: 700; fill: #93858f; letter-spacing: .2em; }
</style>

<rect width="1200" height="480" fill="#1e141b"/>
<path d="M22 46 V22 H46 M1178 434 V458 H1154" fill="none" stroke="#a9c29b" stroke-width="2.5"/>

<text class="f kick" x="60" y="52">FINAL BALANCE</text>
<text class="f ttl"  x="60" y="96">作戦総括</text>

<!-- 人類側 -->
<rect x="60" y="140" width="490" height="280" fill="#3a2233" stroke="#655360" stroke-width="2"/>
<rect x="60" y="140" width="490" height="5" fill="#a9c29b"/>
<text class="f who" x="305" y="186" text-anchor="middle">人類</text>
<text class="f k" x="305" y="228" text-anchor="middle">兵装</text>
<text class="f v" x="305" y="266" text-anchor="middle">八点</text>
<text class="f k" x="305" y="308" text-anchor="middle">投資</text>
<text class="f v" x="305" y="346" text-anchor="middle">一八万円</text>
<text class="f k" x="305" y="388" text-anchor="middle">所要　七二時間</text>

<!-- むぎ側 -->
<rect x="650" y="140" width="490" height="280" fill="#3a2233" stroke="#dde7d7" stroke-width="2"/>
<rect x="650" y="140" width="490" height="5" fill="#dde7d7"/>
<text class="f whog" x="895" y="186" text-anchor="middle">むぎ</text>
<text class="f k" x="895" y="228" text-anchor="middle">兵装</text>
<text class="f vg" x="895" y="266" text-anchor="middle">なし</text>
<text class="f k" x="895" y="308" text-anchor="middle">投資</text>
<text class="f vg" x="895" y="346" text-anchor="middle">〇円</text>
<text class="f k" x="895" y="388" text-anchor="middle">所要　初日から</text>

<!-- 同じ結果に到達している -->
<text class="f mid" x="600" y="274" text-anchor="middle">同じ</text>
<text class="f mid" x="600" y="302" text-anchor="middle">快適</text>
<path d="M600 180 V250 M600 320 V400" stroke="#655360" stroke-width="2"/>
</svg>
