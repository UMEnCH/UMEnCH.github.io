<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">冗長化の三段構え — 単一障害点が落ちたあと</title>
<desc id="d">電気という単一障害点が断たれたあと、カセットコンロ・ポータブル電源・むぎの体温という三段の代替手段に落ちていく構造の図</desc>
<!-- 背景に敷く図。立ち絵が下から重なるので、内容は上寄せ・中央寄せにしてある。
     img で読むため色とフォントは直値で持つ（親のCSSも Webフォントも効かない） -->
<style>
  .f { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .kick { font-size: 15px; font-weight: 700; fill: #ffc233; letter-spacing: .34em; }
  .ttl  { font-size: 34px; font-weight: 800; fill: #e8edf4; letter-spacing: .04em; }
  .dead { font-size: 25px; font-weight: 800; fill: #ff6b6b; letter-spacing: .1em; }
  .no   { font-size: 15px; font-weight: 700; fill: #ffc233; letter-spacing: .2em; }
  .lbl  { font-size: 25px; font-weight: 800; fill: #e8edf4; }
  .scp  { font-size: 19px; font-weight: 700; fill: #8fa1b8; }
  .win  { font-size: 25px; font-weight: 800; fill: #3ddc84; }
  .wins { font-size: 19px; font-weight: 700; fill: #3ddc84; }
</style>

<rect width="1200" height="480" fill="#0a0f16"/>
<path d="M22 46 V22 H46 M1178 434 V458 H1154" fill="none" stroke="#ffc233" stroke-width="2.5"/>

<text class="f kick" x="60" y="52">REDUNDANCY</text>
<text class="f ttl"  x="60" y="96">冗長化の三段構え</text>

<!-- 落ちた単一障害点 -->
<rect x="60" y="140" width="1080" height="52" fill="#1a1016" stroke="#ff6b6b" stroke-width="2"/>
<text class="f dead" x="600" y="175" text-anchor="middle">商用電源　—　停電</text>
<path d="M60 166 H1140" stroke="#ff6b6b" stroke-width="2" opacity=".55"/>

<g stroke="#8fa1b8" stroke-width="2.5" stroke-dasharray="6 5" fill="none">
  <path d="M226 200 V236 M600 200 V236 M974 200 V236"/>
</g>

<!-- 三段のフォールバック -->
<g>
  <rect x="60" y="250" width="333" height="170" fill="#111823" stroke="#1f2c3d" stroke-width="2"/>
  <rect x="60" y="250" width="333" height="5" fill="#ffc233"/>
  <text class="f no"  x="226" y="292" text-anchor="middle">第一の冗長化</text>
  <text class="f lbl" x="226" y="342" text-anchor="middle">カセットコンロ</text>
  <text class="f scp" x="226" y="384" text-anchor="middle">熱</text>
</g>
<g>
  <rect x="433" y="250" width="333" height="170" fill="#111823" stroke="#1f2c3d" stroke-width="2"/>
  <rect x="433" y="250" width="333" height="5" fill="#ffc233"/>
  <text class="f no"  x="600" y="292" text-anchor="middle">第二の冗長化</text>
  <text class="f lbl" x="600" y="342" text-anchor="middle">ポータブル電源</text>
  <text class="f scp" x="600" y="384" text-anchor="middle">情報</text>
</g>
<g>
  <rect x="806" y="250" width="333" height="170" fill="#111823" stroke="#3ddc84" stroke-width="2"/>
  <rect x="806" y="250" width="333" height="5" fill="#3ddc84"/>
  <text class="f no"  x="972" y="292" text-anchor="middle">第三の冗長化</text>
  <text class="f win" x="972" y="342" text-anchor="middle">むぎ　三八度</text>
  <text class="f wins" x="972" y="384" text-anchor="middle">体温</text>
</g>
</svg>
