name: 最新動画をサイトに反映

# チャンネルの公開RSSを読んで index.html の VIDEOS 欄を書き換える。
# APIキーは不要。差分があるときだけコミットするので、更新が無い日は何も起きない。

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST（UTC 21:00）
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RSSから最新動画を取得して index.html を更新
        run: python3 .github/scripts/update_videos.py

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "更新なし。コミットしない。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "最新動画をVIDEOS欄に反映（自動）"
          git push
