<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うめンち物語 — 機密ファイル アーカイブ</title>
<meta name="description" content="うめンち司令部の機密ファイルを、立ち絵と会話で読む読み物版。機密ファイル・火曜サスペンス劇場・美食劇場を収録。">
<meta property="og:title" content="うめンち物語 — 機密ファイル アーカイブ">
<meta property="og:description" content="機密解除された作戦記録を、立ち絵と会話のまま読む読み物版。司令部（うめ）・参謀（松）・猛獣（むぎ）でお送りする全記録。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0f14'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23ffc233' stroke-width='3'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23ffc233'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --panel:#111823; --panel2:#0e141d; --line:#1f2c3d;
  --amber:#ffc233; --amber-d:#e09c00; --green:#3ddc84; --red:#ff5252;
  --txt:#e8edf4; --sub:#8fa1b8; --mono:'Share Tech Mono',monospace;
  /* 話者色は Final Cut 版のテロップ縁取り色に対応させる（地の文の黒だけは暗背景で使えないため置換） */
  --sp-ume:#ff5252; --sp-matsu:#3ddc84; --sp-mugi:#b07cff; --sp-tv:#6aa8ff; --sp-narration:#8fa1b8;
  /* 前書きに凡例が無い作品の③以降（配達員・電話の音声など、作品ごとに別人）はこの色でまとめる */
  --sp-other:#6aa8ff; --sp-madame:#d9a066;
  --nav-h:54px;
}
/* 本文の文字サイズ（小・中・大）。文字を大きくするぶんテキスト枠を高くし、
   その差だけステージが縮む。立ち絵はステージ高さに対する % 指定なので、一緒に縮んで欠けない。 */
:root,:root[data-size="s"]{--fs-body:16.5px;--tb-h:200px}
:root[data-size="m"]{--fs-body:19.5px;--tb-h:266px}
:root[data-size="l"]{--fs-body:23px;--tb-h:334px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.9;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}

/* ===== ナビ（他ページからの複製） ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(11,15,20,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:var(--nav-h)}
nav .brand{font-weight:900;letter-spacing:.08em;font-size:15px;text-decoration:none;color:var(--txt)}
nav .brand b{color:var(--amber)}
nav .links{display:flex;gap:22px;font-family:var(--mono);font-size:12px;letter-spacing:.12em}
nav .links a{color:var(--sub);text-decoration:none;transition:.2s}
nav .links a:hover,nav .links a.active{color:var(--amber)}
@media(max-width:760px){nav .links{display:none}}

/* ===== リーダー全体 ===== */
.reader{margin-top:var(--nav-h);height:calc(100vh - var(--nav-h));height:calc(100dvh - var(--nav-h));
  display:none;flex-direction:column;position:relative;user-select:none}
.reader.show{display:flex}

/* 上部バー */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 20px;border-bottom:1px solid var(--line);background:var(--panel2);flex:none}
.topbar .ch{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--amber);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .ch span{color:var(--sub);margin-right:10px}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tool{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--sub);background:none;
  border:1px solid var(--line);padding:5px 11px;cursor:pointer;transition:.2s;line-height:1}
.tool:hover{color:var(--amber);border-color:var(--amber)}
.tool[aria-pressed="true"]{color:#141413;background:var(--amber);border-color:var(--amber)}
.count{font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:.1em;min-width:74px;text-align:right}
.bar{height:2px;background:var(--line);flex:none}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}

/* ===== ステージ（背景＋立ち絵） ===== */
/* ステージ＋テキスト枠をまとめた領域。カードはこの全体を覆うので、
   図のときはテキスト枠のぶんまで使える（枠を出し入れしないのでレイアウトは動かない） */
.viewport{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;position:relative;overflow:hidden;cursor:pointer;min-height:0;background:#080b0f}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:saturate(.6)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,15,20,.7) 0%,rgba(11,15,20,.15) 34%,rgba(11,15,20,.8) 100%)}
.stage .gridbg{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(rgba(255,194,51,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,194,51,.05) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 78%)}

.cast{position:absolute;bottom:0;transition:opacity .35s ease,filter .35s ease,transform .35s ease;
  transform-origin:bottom center;pointer-events:none;will-change:opacity,filter;
  /* 幅と高さの両方に制約がかかっても画像が歪まないようにする（狭い画面で max-width が効く） */
  object-fit:contain;object-position:bottom center}
/* 大きさの比は Final Cut 版の scale（うめ .45 / 松 .64 / むぎ 1.0）に合わせている。
   うめはバストアップなので、松より小さく置かないと顔だけが画面を占領する。 */
.cast.ume{right:5%;height:54%}
.cast.matsu{left:6%;height:78%}
/* 第三者（配達員・ご婦人・母など）。松と入れ替わりで同じ左に立つ。
   別画風のバストアップで顔の比率が大きいため、うめより控えめに置く */
.cast.guest{left:6%;height:48%}
.cast.mugi{left:50%;height:36%;transform:translateX(-50%)}
.cast[data-state="off"]{opacity:0;transform:translateY(14px)}
.cast.mugi[data-state="off"]{transform:translateX(-50%) translateY(14px)}
.cast[data-state="dim"]{opacity:.95;filter:brightness(.42) saturate(.6) contrast(.95)}
.cast[data-state="on"]{opacity:1;filter:none}

/* ステージ中央のカード（前書き・章見出し・総括・締め） */
/* カード表示中は立ち絵が消えて背景だけが残るので、暗幕を敷いて文字を読みやすくする。
   z-index はステージの上下グラデーション（.stage::after）より前に出すため */
.card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:28px;
  background:rgba(8,11,15,.72);z-index:2;cursor:pointer}
.card.show{display:flex;animation:cardin .5s ease both}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .inner{max-width:760px;width:100%;background:rgba(14,20,29,.94);border:1px solid var(--line);
  padding:32px 34px;position:relative;max-height:100%;overflow-y:auto}
.card .inner::before,.card .inner::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--amber)}
.card .inner::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.card .inner::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.card .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);margin-bottom:14px}
.card h2{font-size:calc(var(--fs-body) * 1.4);font-weight:900;letter-spacing:.03em;line-height:1.65;margin-bottom:6px}
.card p{font-size:calc(var(--fs-body) * .92);color:#cfd9e6;margin-top:12px}
.card p:first-of-type{margin-top:0}
.card.k-chapter .inner{text-align:center;border-color:var(--amber)}
.card.k-closing .inner{text-align:center}
.card.k-closing h2{font-size:calc(var(--fs-body) * 1.2);color:var(--amber)}
.card.k-quote .kicker{color:var(--green)}
.card.k-quote p{border-left:2px solid var(--line);padding-left:16px;font-weight:700}
/* 図はそれ自体が枠と見出しを持つので、カード側の枠・余白は消して図を主役にする。
   高さいっぱいに収めないと下が切れる */
.card.k-figure{padding:14px}
/* height:100% を与えないと、中身（図）の実寸で伸びてカードからはみ出す。
   テキスト枠のぶんまで使えるので、図は大きめに置ける */
.card.k-figure .inner{max-width:1180px;height:100%;padding:0;background:none;border:none;
  display:flex;flex-direction:column;overflow:hidden}
.card.k-figure .inner::before,.card.k-figure .inner::after{display:none}
.card.k-figure .inner > a{display:flex;flex:1;min-height:0}
.card.k-figure img{display:block;width:100%;height:100%;object-fit:contain}
.card.k-figure .kicker{display:none}
.figzoom{display:none;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.22em;color:var(--sub);margin-top:8px;flex:none}

/* ===== テキストボックス ===== */
/* 高さは文字サイズに連動。1ページの文字数はビューアがこの実寸から逆算するので、常に枠内に収まる */
.textbox{flex:none;height:var(--tb-h);background:var(--panel);
  border-top:1px solid var(--line);position:relative;cursor:pointer;display:flex;flex-direction:column}
.textbox::before{content:"";position:absolute;top:-1px;left:0;width:100%;height:2px;background:var(--sp);opacity:.85}
.textbox .inner{max-width:1020px;width:100%;margin:0 auto;padding:18px 26px 20px;flex:1;display:flex;flex-direction:column;min-height:0}
.who{font-family:var(--mono);font-size:calc(var(--fs-body) * .73);letter-spacing:.2em;color:var(--sp);
  margin-bottom:9px;flex:none;min-height:1.55em}
.who b{font-family:'Zen Kaku Gothic New',sans-serif;font-size:calc(var(--fs-body) * .91);font-weight:900;letter-spacing:.04em;margin-right:9px}
.body{font-size:var(--fs-body);line-height:1.95;flex:1;overflow-y:auto;min-height:0;padding-right:6px}
.body em{font-style:normal;font-weight:900;color:var(--amber)}
.k-narration .body{color:#c8d3e0}
.k-narration .body em{color:#ffd97a}
.nextmark{position:absolute;right:22px;bottom:12px;color:var(--amber);opacity:0;transition:opacity .25s}
.nextmark.show{opacity:.9;animation:bob 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ===== オーバーレイ（タイトル / 目次 / ログ） ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,11,15,.93);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);max-width:720px;width:100%;
  max-height:84vh;display:flex;flex-direction:column;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--amber)}
.sheet::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.sheet::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.sheet header{padding:22px 28px 14px;border-bottom:1px solid var(--line);flex:none}
.sheet .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);margin-bottom:8px}
.sheet h1{font-size:26px;font-weight:900;letter-spacing:.04em;line-height:1.5}
.sheet h2{font-size:16px;font-weight:900;letter-spacing:.02em}
.sheet .sub{font-size:calc(var(--fs-body) * .84);color:var(--sub);margin-top:8px;line-height:1.8}
.sheet .scroll{overflow-y:auto;padding:8px 28px 20px}
.sheet .scroll:empty{padding:0}
.sheet footer{padding:16px 28px 22px;display:flex;gap:12px;flex-wrap:wrap;flex:none;border-top:1px solid var(--line)}
/* タップがテキスト選択に化けて反応しないことがあるので、操作要素は選択不可にする */
.btn,.tool,.jump{user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;font-size:14px;font-weight:700;
  text-decoration:none;cursor:pointer;transition:.2s;letter-spacing:.06em;border:none;font-family:inherit}
.btn-amber{background:var(--amber);color:#141413;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn-amber:hover{background:#ffd24d}
.btn-ghost{color:var(--amber);border:1px solid var(--amber);background:none;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn-ghost:hover{background:rgba(255,194,51,.1)}
.jump{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:13px 4px;color:var(--txt);cursor:pointer;font-family:inherit;font-size:calc(var(--fs-body) * .88);transition:.2s;line-height:1.7}
.jump:hover{color:var(--amber);padding-left:10px}
.jump .no{font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:.18em;margin-right:12px}
.jump.done .no{color:var(--green)}
.logrow{padding:12px 4px;border-bottom:1px solid var(--line);font-size:calc(var(--fs-body) * .88);line-height:1.85}
.logrow .who2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;display:block;margin-bottom:3px}
.logrow em{font-style:normal;font-weight:900;color:var(--amber)}
.logrow.n{color:#b9c5d4}

/* ===== 作品一覧（?id= が無いときの画面） ===== */
.archive{display:none;padding:44px 0 70px;position:relative;margin-top:var(--nav-h)}
.archive.show{display:block}
.archive h1{font-size:30px;font-weight:900;letter-spacing:.04em;margin-bottom:8px}
.archive h1 .tag{display:block;font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.3em;margin-bottom:9px}
.archive .lead{color:var(--sub);font-size:calc(var(--fs-body) * .86);margin-bottom:38px;line-height:1.9}
.series{margin-bottom:40px}
.series h2{font-family:var(--mono);font-size:12px;letter-spacing:.26em;color:var(--amber);
  padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;justify-content:space-between;align-items:baseline}
.series h2 em{font-style:normal;color:var(--sub);font-size:11px;letter-spacing:.1em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.storycard{display:block;background:var(--panel);border:1px solid var(--line);padding:20px 22px 18px;
  text-decoration:none;color:var(--txt);position:relative;transition:.25s}
.storycard::before,.storycard::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--amber);transition:.25s}
.storycard::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.storycard::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.storycard:hover{border-color:#31445e;transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.5)}
.storycard:hover::before,.storycard:hover::after{width:22px;height:22px}
.storycard .no{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--sub);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.storycard .state{color:var(--green);letter-spacing:.1em}
.storycard .state.done{color:var(--amber)}
.storycard h3{font-size:calc(var(--fs-body) * 1.06);font-weight:900;letter-spacing:.02em;line-height:1.55;margin-bottom:9px}
.storycard p{font-size:calc(var(--fs-body) * .8);color:var(--sub);line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.storycard .meta{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:.1em}

/* リーダー左上の一覧へ戻るリンク（モバイルはナビが隠れるのでここが唯一の導線） */
.back-link{display:inline-flex;align-items:center;color:var(--sub);flex:none;transition:.2s;margin-right:10px}
.back-link:hover{color:var(--amber)}

footer.site{padding:34px 0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--sub);
  border-top:1px solid var(--line);letter-spacing:.15em}
footer.site b{color:var(--amber)}
footer.site .back{color:var(--sub);text-decoration:none;letter-spacing:.1em}
footer.site .back:hover{color:var(--amber)}

.hint{font-family:var(--mono);font-size:calc(var(--fs-body) * .76);color:var(--sub);letter-spacing:.1em;margin-top:14px;line-height:2}

@media(max-width:760px){
  /* 狭い画面では同じ pt でも読み幅が短いので、各段を少し控えめにする */
  :root,:root[data-size="s"]{--fs-body:15px;--tb-h:190px}
  :root[data-size="m"]{--fs-body:17.5px;--tb-h:248px}
  :root[data-size="l"]{--fs-body:20.5px;--tb-h:312px}
  .topbar{padding:8px 14px}
  .topbar .ch{font-size:11px}
  .tool{padding:5px 8px;font-size:10px}
  .count{min-width:62px;font-size:10px}
  /* 縦長の画面ではステージが細くなるので、高さと幅の両方を抑え、
     むぎは中央より左に置いて右のうめと重ならないようにする */
  .cast.ume{height:42%;max-width:46%;right:0}
  .cast.matsu{height:56%;max-width:22%;left:1%}
  .cast.guest{height:36%;max-width:36%;left:1%}
  /* 狭い画面では図が縮んで文字が読めないので、拡大できることを明示する。
     幅が制約になるぶん高さが余るので、図の高さは実寸に合わせてヒントを直下に置く */
  .figzoom{display:block}
  .card.k-figure .inner{justify-content:center}
  .card.k-figure .inner > a{flex:0 0 auto}
  .card.k-figure img{height:auto}
  .cast.mugi{height:22%;max-width:22%;left:36%}
  .textbox .inner{padding:14px 18px 18px}
  .body{line-height:1.9}
  .card .inner{padding:24px 20px}
  .card h2{font-size:calc(var(--fs-body) * 1.25)}
  .sheet h1{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  .cast,.bar i{transition:none}
  .nextmark.show{animation:none}
  .card.show{animation:none}
}
</style>
</head>

<section class="archive" id="archive">
  <div class="wrap">
    <h1><span class="tag">CLASSIFIED ARCHIVE</span>うめンち物語</h1>
    <p class="lead">機密解除された作戦記録を、立ち絵と会話のまま読む読み物版。<br>
      司令部（うめ）・参謀（松）・猛獣（むぎ）の三名でお送りする、日常の些事をめぐる全記録。</p>
    <div id="archiveList"></div>
  </div>
</section>

<main class="reader" id="reader">
  <div class="topbar">
    <a class="back-link" href="story.html" title="作品一覧へ戻る" aria-label="作品一覧へ戻る">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
    </a>
    <div class="ch" id="chLabel"><span>CH.--</span>読み込み中</div>
    <div class="tools">
      <button class="tool" id="btnSize" type="button" title="文字サイズを変える">文字 小</button>
      <button class="tool" id="btnIndex" type="button">INDEX</button>
      <button class="tool" id="btnLog" type="button">LOG</button>
      <button class="tool" id="btnAuto" type="button" aria-pressed="false">AUTO</button>
      <span class="count" id="count">--- / ---</span>
    </div>
  </div>
  <div class="bar"><i id="progress"></i></div>

  <!-- ステージとテキスト枠をまとめた領域。カードはこの全体に重なる（テキスト枠のぶんも図に使える） -->
  <div class="viewport">
    <div class="stage" id="stage">
      <img class="bg" src="assets/story/bg-living.jpg" alt="">
      <div class="gridbg"></div>
      <img class="cast matsu" id="castMatsu" src="assets/story/matsu.png" alt="参謀・松" data-state="off">
      <img class="cast guest" id="castGuest" alt="" data-state="off">
      <img class="cast mugi" id="castMugi" src="assets/story/mugi.png" alt="むぎ" data-state="off">
      <img class="cast ume" id="castUme" src="assets/story/ume.png" alt="総司令官・うめ" data-state="off">
    </div>

    <div class="textbox" id="textbox" style="--sp:var(--sp-narration)">
      <div class="inner">
        <div class="who" id="who"></div>
        <div class="body" id="body"></div>
      </div>
      <div class="nextmark" id="nextmark" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M2 2l7 8 7-8"/>
        </svg>
      </div>
    </div>

    <div class="card" id="card"><div class="inner" id="cardInner"></div></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <header>
      <div class="kicker" id="sheetKicker">CLASSIFIED</div>
      <h1 id="sheetTitle">読み込み中</h1>
      <div class="sub" id="sheetSub"></div>
    </header>
    <div class="scroll" id="sheetBody"></div>
    <footer id="sheetFoot"></footer>
  </div>
</div>

<footer class="site">
  UMENCHI FORTRESS COMMAND — <b>家芸人うめ</b> / CLASSIFIED FILE ARCHIVE
  <br><a class="back" href="index.html#top">&lt;- 司令部トップに戻る</a>
</footer>

<script>
(function(){
  'use strict';

  var STORY_ID = new URLSearchParams(location.search).get('id') || '';
  var INDEX_SRC = 'data/stories/index.json';
  var TYPE_SPEED = 26;          // 1文字あたりのミリ秒
  var AUTO_BASE = 900;          // 自動送りの基本待ち時間
  var AUTO_PER_CHAR = 42;       // 自動送りの文字数あたり追加待ち
  var CARD_KINDS = {briefing:1, chapter:1, quote:1, closing:1, figure:1};

  var noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var el = {
    reader: document.getElementById('reader'),
    archive: document.getElementById('archive'),
    archiveList: document.getElementById('archiveList'),
    chLabel: document.getElementById('chLabel'),
    count: document.getElementById('count'),
    progress: document.getElementById('progress'),
    stage: document.getElementById('stage'),
    card: document.getElementById('card'),
    cardInner: document.getElementById('cardInner'),
    textbox: document.getElementById('textbox'),
    who: document.getElementById('who'),
    body: document.getElementById('body'),
    nextmark: document.getElementById('nextmark'),
    overlay: document.getElementById('overlay'),
    sheetKicker: document.getElementById('sheetKicker'),
    sheetTitle: document.getElementById('sheetTitle'),
    sheetSub: document.getElementById('sheetSub'),
    sheetBody: document.getElementById('sheetBody'),
    sheetFoot: document.getElementById('sheetFoot'),
    btnSize: document.getElementById('btnSize'),
    btnIndex: document.getElementById('btnIndex'),
    btnLog: document.getElementById('btnLog'),
    btnAuto: document.getElementById('btnAuto'),
    cast: {
      ume: document.getElementById('castUme'),
      matsu: document.getElementById('castMatsu'),
      mugi: document.getElementById('castMugi'),
      guest: document.getElementById('castGuest')
    }
  };

  var data = null, scenes = [], pos = 0, page = 0, maxSeen = 0;
  var pages = [];               // 現在のシーンをテキスト枠の実寸で割ったページ列
  var typing = false, typeTimer = null, autoTimer = null, auto = false, started = false;

  /* ---------- 文字サイズ ---------- */
  var SIZES = ['s', 'm', 'l'];
  var SIZE_LABEL = {s: '小', m: '中', l: '大'};
  var SIZE_KEY = 'umench-story:size';
  var sizeIdx = 0;

  function applySize(idx, redraw){
    sizeIdx = (idx + SIZES.length) % SIZES.length;
    var name = SIZES[sizeIdx];
    document.documentElement.dataset.size = name;
    el.btnSize.textContent = '文字 ' + SIZE_LABEL[name];
    el.btnSize.title = '文字サイズ: ' + SIZE_LABEL[name] + '（押すと切り替え）';
    try { localStorage.setItem(SIZE_KEY, name); } catch(e){}
    if (redraw) repaginate();
  }

  /* ---------- ページ分割（テキスト枠の実寸から逆算する） ---------- */
  function charsPerPage(){
    var cs = getComputedStyle(el.body);
    var fs = parseFloat(cs.fontSize) || 16;
    var lh = parseFloat(cs.lineHeight) || fs * 1.95;
    var w = el.body.clientWidth || 600;
    var h = el.body.clientHeight || 120;
    // 日本語は全角なので 1文字 ≒ 1em として数える
    var perLine = Math.max(6, Math.floor(w / fs));
    var lines = Math.max(1, Math.floor(h / lh));
    // 行頭禁則や半角混在ではみ出すぶん、半行ぶん余裕を残す
    return Math.max(24, perLine * lines - Math.ceil(perLine / 2));
  }

  function splitLengths(text, limit){
    var pieces = [], buf = '', i;
    for (i = 0; i < text.length; i++){
      buf += text.charAt(i);
      if ('。！？'.indexOf(text.charAt(i)) >= 0){ pieces.push(buf); buf = ''; }
    }
    if (buf) pieces.push(buf);

    // 1文が枠に収まらない場合だけ読点でさらに割る
    var fine = [];
    for (i = 0; i < pieces.length; i++){
      if (pieces[i].length <= limit){ fine.push(pieces[i]); continue; }
      var b = '';
      for (var k = 0; k < pieces[i].length; k++){
        b += pieces[i].charAt(k);
        if (pieces[i].charAt(k) === '、'){ fine.push(b); b = ''; }
      }
      if (b) fine.push(b);
    }

    var out = [], cur = '';
    for (i = 0; i < fine.length; i++){
      if (!cur) cur = fine[i];
      else if (cur.length + fine[i].length <= limit) cur += fine[i];
      else { out.push(cur.length); cur = fine[i]; }
      while (cur.length > limit){ out.push(limit); cur = cur.slice(limit); }
    }
    if (cur) out.push(cur.length);
    return out;
  }

  function sliceSegments(segs, start, end){
    var out = [], pos2 = 0;
    for (var i = 0; i < segs.length; i++){
      var a = pos2, b = pos2 + segs[i].t.length;
      pos2 = b;
      var from = Math.max(a, start), to = Math.min(b, end);
      if (from < to) out.push({t: segs[i].t.slice(from - a, to - a), b: segs[i].b});
    }
    return out;
  }

  function computePages(segs){
    var text = segsText(segs);
    var limit = charsPerPage();
    if (text.length <= limit) return [segs];
    var lens = splitLengths(text, limit);
    var out = [], start = 0;
    for (var i = 0; i < lens.length; i++){
      out.push(sliceSegments(segs, start, start + lens[i]));
      start += lens[i];
    }
    return out;
  }

  // 文字サイズ変更・画面リサイズのあと、今のシーンを割り直して出し直す
  function repaginate(){
    if (!started || !scenes.length) return;
    var sc = scenes[pos];
    if (CARD_KINDS[sc.kind]) return;
    stopTyping();
    clearAuto();
    pages = computePages(sc.segments);
    page = Math.min(page, pages.length - 1);
    showPage();
  }

  /* ---------- 保存（続きから） ---------- */
  function keyFor(id){ return 'umench-story:' + id; }
  var KEY = keyFor(STORY_ID);
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify({pos: pos, maxSeen: maxSeen})); } catch(e){}
  }
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; }
  }
  function progressOf(id){
    try { return JSON.parse(localStorage.getItem(keyFor(id)) || 'null'); } catch(e){ return null; }
  }

  /* ---------- セグメント → DOM ---------- */
  function appendSegments(target, segs){
    for (var i = 0; i < segs.length; i++){
      if (segs[i].b){
        var em = document.createElement('em');
        em.textContent = segs[i].t;
        target.appendChild(em);
      } else {
        target.appendChild(document.createTextNode(segs[i].t));
      }
    }
    return target;
  }
  function segsText(segs){
    var s = '';
    for (var i = 0; i < segs.length; i++) s += segs[i].t;
    return s;
  }

  /* ---------- 立ち絵 ---------- */
  function applyCast(cast, guest){
    // ゲスト枠は作品ごとに中身が変わる（配達員・ご婦人・母…）ので、出す直前に差し替える
    if (guest && el.cast.guest.dataset.name !== guest){
      el.cast.guest.src = 'assets/story/cast/' + guest + '.png';
      el.cast.guest.dataset.name = guest;
    }
    for (var key in el.cast){
      if (!el.cast.hasOwnProperty(key)) continue;
      el.cast[key].dataset.state = (cast && cast[key]) ? cast[key] : 'off';
    }
  }

  /* ---------- タイプライター ---------- */
  function stopTyping(){
    if (typeTimer){ clearInterval(typeTimer); typeTimer = null; }
    typing = false;
  }
  // タイプ演出を飛ばして現在ページを出し切る
  function showPage(){
    stopTyping();
    var segs = pages[page] || [];
    el.body.textContent = '';
    appendSegments(el.body, segs);
    el.nextmark.classList.add('show');
    scheduleAuto(segsText(segs).length);
  }
  function typePage(){
    stopTyping();
    clearAuto();
    var segs = pages[page] || [];
    el.body.textContent = '';
    el.nextmark.classList.remove('show');

    if (noMotion){ showPage(); return; }

    var nodes = [];
    for (var i = 0; i < segs.length; i++){
      var node = segs[i].b ? document.createElement('em') : document.createElement('span');
      el.body.appendChild(node);
      nodes.push({node: node, text: segs[i].t, at: 0});
    }
    typing = true;
    var si = 0;
    typeTimer = setInterval(function(){
      while (si < nodes.length && nodes[si].at >= nodes[si].text.length) si++;
      if (si >= nodes.length){ showPage(); return; }
      var n = nodes[si];
      n.node.textContent += n.text.charAt(n.at++);
    }, TYPE_SPEED);
  }

  /* ---------- 自動送り ---------- */
  function clearAuto(){ if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; } }
  function scheduleAuto(len){
    clearAuto();
    if (!auto || el.overlay.classList.contains('show')) return;
    autoTimer = setTimeout(function(){ advance(); }, AUTO_BASE + len * AUTO_PER_CHAR);
  }

  /* ---------- カード表示 ---------- */
  function renderCard(sc){
    var inner = el.cardInner;
    inner.textContent = '';
    el.card.className = 'card show k-' + sc.kind;

    var kicker = document.createElement('div');
    kicker.className = 'kicker';

    if (sc.kind === 'chapter'){
      kicker.textContent = 'CHAPTER ' + ('0' + sc.ch).slice(-2);
      inner.appendChild(kicker);
      var h = document.createElement('h2');
      h.textContent = sc.text;
      inner.appendChild(h);
    } else if (sc.kind === 'briefing'){
      kicker.textContent = 'CLASSIFIED — 機密解除';
      inner.appendChild(kicker);
      for (var i = 0; i < sc.lines.length; i++){
        appendSegments(inner.appendChild(document.createElement('p')), sc.lines[i]);
      }
    } else if (sc.kind === 'quote'){
      kicker.textContent = 'SUMMARY — 総括';
      inner.appendChild(kicker);
      for (var j = 0; j < sc.lines.length; j++){
        appendSegments(inner.appendChild(document.createElement('p')), sc.lines[j]);
      }
    } else if (sc.kind === 'figure'){
      kicker.textContent = 'FIGURE';
      inner.appendChild(kicker);
      // 図そのものが見出しを持っているので、キャプションは画面には出さず alt と LOG に回す。
      // 狭い画面では縮みすぎて文字が読めないため、別タブで原寸を開けるようにする
      var img = document.createElement('img');
      img.src = sc.src;
      img.alt = sc.alt || sc.caption || '';

      var link = document.createElement('a');
      link.href = sc.src;
      link.target = '_blank';
      link.rel = 'noopener';
      link.title = '図を大きく表示';
      link.addEventListener('click', function(e){ e.stopPropagation(); });
      link.appendChild(img);
      inner.appendChild(link);

      var zoom = document.createElement('p');
      zoom.className = 'figzoom';
      zoom.textContent = 'TAP TO ENLARGE';
      inner.appendChild(zoom);
    } else {
      kicker.textContent = 'END OF FILE';
      inner.appendChild(kicker);
      appendSegments(inner.appendChild(document.createElement('h2')), sc.segments);
    }

    pages = [];
    page = 0;

    // テキスト枠は出し入れせず空にするだけ。display を切り替えるとステージの高さが変わり、
    // 高さ比で置いている立ち絵のサイズが跳ねてしまう
    el.textbox.className = 'textbox k-narration';
    el.textbox.style.setProperty('--sp', 'var(--sp-narration)');
    el.who.textContent = '';
    el.body.textContent = '';
    el.nextmark.classList.remove('show');

    clearAuto();
    if (auto) scheduleAuto(40);
  }

  /* ---------- シーン描画 ---------- */
  function renderScene(){
    var sc = scenes[pos];
    applyCast(sc.cast, sc.guest);

    var chapter = null;
    for (var i = 0; i < data.chapters.length; i++){
      if (data.chapters[i].index === sc.ch) chapter = data.chapters[i];
    }
    el.chLabel.textContent = '';
    var tag = document.createElement('span');
    tag.textContent = chapter ? 'CH.' + ('0' + chapter.index).slice(-2) : 'FILE';
    el.chLabel.appendChild(tag);
    el.chLabel.appendChild(document.createTextNode(chapter ? chapter.short : data.title));

    el.count.textContent = ('00' + (pos + 1)).slice(-3) + ' / ' + scenes.length;
    el.progress.style.width = ((pos + 1) / scenes.length * 100) + '%';

    if (CARD_KINDS[sc.kind]){ renderCard(sc); return; }

    el.card.className = 'card';
    el.textbox.className = 'textbox k-' + sc.kind;

    // 凡例のない ③以降（s3, s4…）には専用色が無いので --sp-other に落とす
    var color = 'var(--sp-' + (sc.speaker || 'narration') + ', var(--sp-other))';
    el.textbox.style.setProperty('--sp', color);

    el.who.textContent = '';
    if (sc.kind === 'dialog'){
      var spec = data.speakers[sc.speaker] || {name: '', role: ''};
      if (spec.name){
        var b = document.createElement('b');
        b.textContent = spec.name;
        el.who.appendChild(b);
        if (spec.role) el.who.appendChild(document.createTextNode(spec.role));
      }
    }

    // 枠の実寸が確定してから割る（文字サイズ・画面幅が変われば結果も変わる）
    pages = computePages(sc.segments);
    page = 0;
    typePage();
  }

  /* ---------- 進行 ---------- */
  function goto(i){
    if (i < 0 || i >= scenes.length) return;
    stopTyping();
    clearAuto();
    pos = i;
    page = 0;
    if (pos > maxSeen) maxSeen = pos;
    save();
    renderScene();
  }
  function advance(){
    if (typing){ showPage(); return; }
    if (page < pages.length - 1){
      page++;
      save();
      typePage();
      return;
    }
    if (pos >= scenes.length - 1){ openEnd(); return; }
    goto(pos + 1);
  }
  function back(){
    if (page > 0){ page--; typePage(); return; }
    goto(pos - 1);
  }

  /* ---------- オーバーレイ ---------- */
  function closeOverlay(){
    el.overlay.classList.remove('show');
    if (started && auto) scheduleAuto(20);
  }
  function openSheet(kicker, title, sub){
    clearAuto();
    el.sheetKicker.textContent = kicker;
    el.sheetTitle.textContent = title;
    el.sheetSub.textContent = sub || '';
    el.sheetBody.textContent = '';
    el.sheetFoot.textContent = '';
    el.overlay.classList.add('show');
  }
  function addButton(label, cls, fn){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.addEventListener('click', fn);
    el.sheetFoot.appendChild(b);
    return b;
  }

  function openTitle(){
    var saved = load();
    openSheet(labelOf(data), data.title, data.subtitle);

    if (saved && saved.pos > 0 && saved.pos < scenes.length){
      addButton('続きから読む', 'btn-amber', function(){
        maxSeen = Math.max(saved.maxSeen || 0, saved.pos);
        started = true; closeOverlay(); goto(saved.pos);
      });
      addButton('最初から読む', 'btn-ghost', function(){
        started = true; closeOverlay(); goto(0);
      });
    } else {
      addButton('読み始める', 'btn-amber', function(){
        started = true; closeOverlay(); goto(0);
      });
    }
  }

  function openIndex(){
    openSheet('INDEX', '目次', data.title + '（' + labelOf(data) + '）');
    data.chapters.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'jump' + (c.scene <= maxSeen ? ' done' : '');
      var no = document.createElement('span');
      no.className = 'no';
      no.textContent = 'CH.' + ('0' + c.index).slice(-2);
      b.appendChild(no);
      b.appendChild(document.createTextNode(c.full));
      b.addEventListener('click', function(){ started = true; closeOverlay(); goto(c.scene); });
      el.sheetBody.appendChild(b);
    });
    addButton('閉じる', 'btn-ghost', closeOverlay);
  }

  function openLog(){
    openSheet('LOG', 'これまでの記録', '読んだところまでを振り返れます。');
    var shown = 0;
    for (var i = 0; i <= maxSeen && i < scenes.length; i++){
      var sc = scenes[i];
      var row = document.createElement('div');
      row.className = 'logrow' + (sc.kind === 'dialog' ? '' : ' n');

      if (sc.kind === 'dialog'){
        var spec = data.speakers[sc.speaker] || {name: sc.speaker};
        var w = document.createElement('span');
        w.className = 'who2';
        w.style.color = 'var(--sp-' + sc.speaker + ')';
        w.textContent = spec.name;
        row.appendChild(w);
      } else if (sc.kind === 'chapter'){
        var w2 = document.createElement('span');
        w2.className = 'who2';
        w2.style.color = 'var(--amber)';
        w2.textContent = 'CHAPTER ' + ('0' + sc.ch).slice(-2);
        row.appendChild(w2);
      }

      if (sc.segments) appendSegments(row, sc.segments);
      else if (sc.text) row.appendChild(document.createTextNode(sc.text));
      else if (sc.lines) sc.lines.forEach(function(p){ appendSegments(row, p); });
      else if (sc.caption) row.appendChild(document.createTextNode('［図］' + sc.caption));

      el.sheetBody.appendChild(row);
      shown++;
    }
    if (!shown){
      var p = document.createElement('div');
      p.className = 'hint';
      p.textContent = 'まだ記録がありません。';
      el.sheetBody.appendChild(p);
    }
    addButton('閉じる', 'btn-ghost', closeOverlay);
    requestAnimationFrame(function(){ el.sheetBody.scrollTop = el.sheetBody.scrollHeight; });
  }

  function openEnd(){
    openSheet('END OF FILE', '読了', labelOf(data));
    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = data.no
      ? '以上、機密ファイル No.' + data.no + '、これにて配信終了。'
      : 'これにて終了。';
    el.sheetBody.appendChild(hint);
    addButton('ほかの作品を読む', 'btn-amber', function(){ location.href = 'story.html'; });
    addButton('もう一度読む', 'btn-ghost', function(){ closeOverlay(); goto(0); });
  }

  /* ---------- 作品一覧 ---------- */
  function labelOf(story){
    var ep = story.episode || (story.no ? 'No.' + story.no : '');
    return story.series + (ep ? ' ' + ep : '');
  }

  function renderArchive(index){
    var groups = [];
    index.stories.forEach(function(story){
      var g = groups.filter(function(x){ return x.series === story.series; })[0];
      if (!g){ g = {series: story.series, items: []}; groups.push(g); }
      g.items.push(story);
    });

    groups.forEach(function(group){
      var section = document.createElement('div');
      section.className = 'series';

      var h2 = document.createElement('h2');
      h2.appendChild(document.createTextNode(group.series));
      var count = document.createElement('em');
      count.textContent = group.items.length + (group.items.length === 1 ? ' FILE' : ' FILES');
      h2.appendChild(count);
      section.appendChild(h2);

      var cards = document.createElement('div');
      cards.className = 'cards';

      group.items.forEach(function(story){
        var card = document.createElement('a');
        card.className = 'storycard';
        card.href = 'story.html?id=' + encodeURIComponent(story.id);

        var no = document.createElement('div');
        no.className = 'no';
        no.appendChild(document.createTextNode(story.episode || ('No.' + story.no)));

        var saved = progressOf(story.id);
        if (saved && saved.pos > 0){
          var state = document.createElement('span');
          var done = saved.maxSeen >= story.scenes - 1;
          state.className = 'state' + (done ? ' done' : '');
          state.textContent = done ? '読了' : '続き ' + Math.round(saved.pos / story.scenes * 100) + '%';
          no.appendChild(state);
        }
        card.appendChild(no);

        var h3 = document.createElement('h3');
        h3.textContent = story.title;
        card.appendChild(h3);

        var p = document.createElement('p');
        p.textContent = story.tagline;
        card.appendChild(p);

        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = story.chapters + '章 / ' + story.scenes + 'シーン / 約'
          + Math.round(story.chars / 1000) + ',000字';
        card.appendChild(meta);

        cards.appendChild(card);
      });

      section.appendChild(cards);
      el.archiveList.appendChild(section);
    });

    el.archive.classList.add('show');
  }

  function fail(message){
    openSheet('ERROR', '読み込めませんでした', message);
    el.sheetFoot.textContent = '';
  }

  /* ---------- イベント ---------- */
  el.stage.addEventListener('click', function(){ if (started) advance(); });
  el.textbox.addEventListener('click', function(){ if (started) advance(); });
  // カードはステージとテキスト枠の上に重なるので、送りは自前で受ける
  el.card.addEventListener('click', function(){ if (started) advance(); });

  el.btnSize.addEventListener('click', function(e){ e.stopPropagation(); applySize(sizeIdx + 1, true); });
  el.btnIndex.addEventListener('click', function(e){ e.stopPropagation(); openIndex(); });
  el.btnLog.addEventListener('click', function(e){ e.stopPropagation(); openLog(); });
  el.btnAuto.addEventListener('click', function(e){
    e.stopPropagation();
    auto = !auto;
    el.btnAuto.setAttribute('aria-pressed', auto ? 'true' : 'false');
    if (auto && started && !typing) scheduleAuto(20); else clearAuto();
  });

  el.overlay.addEventListener('click', function(e){
    if (e.target === el.overlay && started) closeOverlay();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ if (started) closeOverlay(); return; }
    if (el.overlay.classList.contains('show') || !started) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault(); advance();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault(); back();
    }
  });

  // 画面幅が変わるとページの割り方も変わるので、落ち着いてから割り直す
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(repaginate, 220);
  });

  /* ---------- 起動 ---------- */
  (function restoreSize(){
    var saved = null;
    try { saved = localStorage.getItem(SIZE_KEY); } catch(e){}
    var i = SIZES.indexOf(saved);
    applySize(i >= 0 ? i : 0, false);
  })();

  function getJSON(url){
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function failMessage(err){
    return location.protocol === 'file:'
      ? 'ローカルファイルとして開かれています。HTTP サーバ経由で開いてください。'
      : 'データの取得に失敗しました（' + err.message + '）。';
  }

  if (STORY_ID){
    // 1作品を読む画面
    el.reader.classList.add('show');
    getJSON('data/stories/' + STORY_ID + '.json')
      .then(function(json){
        data = json;
        scenes = json.scenes;
        document.title = json.title + '〈' + labelOf(json) + '〉 — うめンち物語';
        openTitle();
      })
      .catch(function(err){
        fail(failMessage(err) + ' 作品ID「' + STORY_ID + '」が存在しない可能性があります。');
        addButton('作品一覧へ', 'btn-amber', function(){ location.href = 'story.html'; });
      });
  } else {
    // 作品一覧
    document.title = 'うめンち物語 — 機密ファイル アーカイブ';
    getJSON(INDEX_SRC)
      .then(renderArchive)
      .catch(function(err){ fail(failMessage(err)); });
  }
})();
</script>
</body>
</html>
